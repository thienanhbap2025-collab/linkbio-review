<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My LinkBio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container fade-in">
        <header class="profile">
            <img src="assets/avatar.png" class="avatar" alt="avatar">
            <h1 class="name">Luci</h1>
            <p class="bio">Creator • Coding • Cozy Workspace</p>
        </header>
        <section class="links">
            <a href="#" class="btn">Shop My Favorites</a>
            <a href="#" class="btn">TikTok</a>
            <a href="#" class="btn">Instagram</a>
            <a href="#" class="btn">YouTube</a>
        </section>
        <section class="image-map-container fade-in">
            <img src="assets/image01.jpg" usemap="#map1" class="feature-img" alt="featured">
            <map name="map1">
                <area shape="rect" coords="20,20,180,180" href="https://google.com" target="_blank">
                <area shape="rect" coords="200,20,360,180" href="https://tiktok.com" target="_blank">
            </map>
        </section>
        <section class="video-block fade-in">
            <video controls src="assets/video01.mp4"></video>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
